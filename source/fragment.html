/* Reading typography and tactile interactions */
#kotonoha-v1{--kh-system:-apple-system,BlinkMacSystemFont,'Hiragino Kaku Gothic ProN','Yu Gothic',Meiryo,sans-serif}
#kotonoha-v1 .hand,#kotonoha-v1 .avatar,#kotonoha-v1 .leaf p,#kotonoha-v1 textarea,#kotonoha-v1 .diary-text,#kotonoha-v1 .blank-collage,#kotonoha-v1 .scribble{font-family:var(--kh-system)}
#kotonoha-v1 .leaf h3,#kotonoha-v1 .paper-page h2{font-family:'Zen Maru Gothic',sans-serif}
#kotonoha-v1 .book-zone{perspective:1000px}
#kotonoha-v1 .book-cover{transform-origin:left center;transform-style:preserve-3d;backface-visibility:hidden}
#kotonoha-v1 .spread{transform-style:preserve-3d;perspective:1200px;isolation:isolate}
#kotonoha-v1 [data-swipe]{touch-action:pan-y;user-select:none;-webkit-user-select:none}
#kotonoha-v1 .leaf{height:332px;min-height:332px}
#kotonoha-v1 .leaf h3{font-size:13px}
#kotonoha-v1 .leaf p{font-size:10px;line-height:1.8;max-height:125px;overflow:hidden;white-space:pre-line}
#kotonoha-v1 .leaf-art{height:90px;position:relative;margin-top:14px}
#kotonoha-v1 .leaf-art .margin-sticker{transform:scale(.45);transform-origin:top left;top:0;bottom:auto}
#kotonoha-v1 .leaf-art .position-0{left:0}#kotonoha-v1 .leaf-art .position-1{left:60px;top:20px}#kotonoha-v1 .leaf-art .position-2{display:none}
#kotonoha-v1 .leaf-art .sticker{position:static;transform:none}
#kotonoha-v1 .reading-stage{perspective:1400px;position:relative;isolation:isolate}
#kotonoha-v1 .flip-layer{position:absolute;left:50%;top:0;width:50%;height:100%;z-index:10;transform-style:preserve-3d;transform-origin:left center;pointer-events:none}
#kotonoha-v1 .flip-layer.backward{left:0;transform-origin:right center}
#kotonoha-v1 .flip-layer.full-leaf{left:13px;width:calc(100% - 26px)}
#kotonoha-v1 .flip-face,#kotonoha-v1 .flip-reverse{position:absolute!important;inset:0;width:100%!important;height:100%;margin:0!important;backface-visibility:hidden;overflow:hidden;box-shadow:0 8px 30px #3c402126}
#kotonoha-v1 .flip-reverse{transform:rotateY(180deg);border:1px solid #d8d3c4;background-color:#f5f1e3}
#kotonoha-v1 .flip-face:after{content:'';position:absolute;inset:0;background:linear-gradient(90deg,#5d52342a,transparent 42%,#fff7d811);pointer-events:none}
#kotonoha-v1 .paper-page{padding:22px 18px 105px;min-height:535px;text-align:center;overflow:hidden}
#kotonoha-v1 .paper-page .page-date{font:14px/1.7 var(--kh-system);letter-spacing:.02em;justify-content:center;gap:16px;flex-wrap:wrap;margin-bottom:68px;color:#506456}
#kotonoha-v1 .diary-content{position:relative;z-index:2;max-width:280px;margin:0 auto}
#kotonoha-v1 .paper-page h2{font-size:22px;line-height:1.7;max-width:none;margin:0 0 24px;text-wrap:balance}
#kotonoha-v1 .paper-page .diary-text{font:16px/2 var(--kh-system);white-space:normal;text-align:center;line-break:strict;word-break:normal;overflow-wrap:anywhere}
#kotonoha-v1 .sentence{display:block;text-wrap:balance}
#kotonoha-v1 .margin-sticker{position:absolute;z-index:1;display:block;pointer-events:none}
#kotonoha-v1 .position-0{left:4px;top:59px;transform:scale(.32) rotate(-12deg);transform-origin:top left}
#kotonoha-v1 .position-1{right:0;bottom:5px;transform:scale(.65) rotate(8deg);transform-origin:bottom right}
#kotonoha-v1 .position-2{right:14px;top:65px;transform:scale(.47) rotate(13deg);transform-origin:top right}
#kotonoha-v1 .pictorial-sticker{display:grid;place-items:center;font:74px/1.2 var(--kh-system);background:#fffdf7;border:6px solid #fffdf7;border-radius:36% 49% 39% 45%;filter:drop-shadow(0 3px 2px #51473120)}
#kotonoha-v1 .word-sticker{display:inline-block;position:absolute;bottom:30px;left:30px;max-width:190px;border:6px solid #fffdf7;background:#eee1bc;padding:8px 12px;box-shadow:0 3px 5px #67552616;transform:rotate(-7deg);font:12px var(--kh-system)}
#kotonoha-v1 .photo-strip{display:flex;justify-content:center;flex-wrap:wrap;gap:15px;margin:28px 0 0;position:relative;z-index:2}
#kotonoha-v1 .photo-strip .photo-print{position:relative;right:auto;top:auto;width:125px;height:142px;transform:rotate(-5deg)}
#kotonoha-v1 .photo-strip .photo-print:nth-child(even){transform:rotate(5deg)}
#kotonoha-v1 .screen-base{min-height:726px;position:relative}
#kotonoha-v1 .sheet-shade{position:absolute;inset:0;background:#263b3652;z-index:25;animation:kh-shade .25s ease-out}
#kotonoha-v1 .compose-sheet{position:absolute;bottom:0;left:0;right:0;z-index:26;border-radius:25px 25px 0 0;background:var(--kh-bg);box-shadow:0 -10px 40px #25382e20;animation:kh-sheet .36s cubic-bezier(.2,.7,.2,1);padding-bottom:12px;max-height:100%;overflow-y:auto;overscroll-behavior:contain}
#kotonoha-v1 .sheet-handle{height:4px;width:38px;background:#c6cabf;border-radius:4px;margin:11px auto 0}
#kotonoha-v1 .compose-sheet .topbar{padding:4px 19px 0}
#kotonoha-v1 .compose-intro{margin:7px 0 19px}
#kotonoha-v1 .entry-area{background:var(--kh-paper);background-image:none;border:0;border-radius:12px;box-shadow:none;padding:17px}
#kotonoha-v1 textarea{font:16px/1.9 var(--kh-system);min-height:166px;resize:vertical}
#kotonoha-v1 .attachment-list{margin:16px 0 20px;min-height:0}
#kotonoha-v1 .attachment img{display:block}
#kotonoha-v1 .attachment button{width:30px;height:30px}
#kotonoha-v1 .compose-sheet .primary{font-size:14px}
@keyframes kh-sheet{from{transform:translateY(100%)}to{transform:translateY(0)}}
@keyframes kh-shade{from{opacity:0}to{opacity:1}}
@media(prefers-reduced-motion:reduce){#kotonoha-v1 .compose-sheet,#kotonoha-v1 .sheet-shade{animation:none}}

function persist(){if(window.openai?.setWidgetState)window.openai.setWidgetState({modelContent:{screen:state.sheet?labels[4]:labels[state.screen],child:children[state.child].name},privateContent:{version:3,screen:state.screen,child:state.child,page:state.page}}).catch(()=>{});}
function restore(v){const p=v?.privateContent;if(!p||p.version!==3)return;state.child=p.child===1?1:0;state.screen=Number.isInteger(p.screen)?Math.max(0,Math.min(5,p.screen)):0;if(state.screen===4)state.screen=1;state.page=Math.min(records[state.child].length-1,Math.max(0,Number(p.page)||0));}
/* Begin each live demonstration at the child picker. */
function msg(text){const t=root.querySelector('.toast');t.textContent=text;t.hidden=false;clearTimeout(toastTimer);toastTimer=setTimeout(()=>t.hidden=true,3200);}
function nav(n){navigationEpoch++;if(n===4){openSheet();return;}state.screen=n;state.sheet=false;state.menu=false;render();persist();}
function openSheet(){focusBeforeSheet=document.activeElement;state.menu=false;state.sheet=true;render();root.querySelector('.sheet-close')?.focus({preventScroll:true});persist();}
function closeSheet(){state.sheet=false;render();root.querySelector('[data-action=new]')?.focus({preventScroll:true});persist();}
function childHeader(back){return `<div class="topbar library-topbar"><button class="profile-switch" data-screen="0">${avatar(state.child)}<span>${children[state.child].name}の日記</span>${icon('chevron-down')}</button>${back?`<button class="icon-btn" data-action="close-book" aria-label="日記を閉じる">${icon('x')}</button>`:'<span class="header-space"></span>'}</div>`;}
function libraryTitle(){return `<div class="shelf-title"><div class="eyebrow">OUR LITTLE LIBRARY</div><h2>1歳の記録</h2><p class="muted">2025.11 — 2026.10　·　${records[state.child].length}ページ</p></div>`;}
function newEntry(){return `<button class="primary new-entry" data-action="new">${icon('plus')}今日を残す</button>`;}
function controls(){return `<div class="page-control"><button class="icon-btn" data-action="prev" aria-label="前のページ" ${(state.screen===2?Math.floor(state.page/2)===0:state.page===0)?'disabled':''}>${icon('chevron-left')}</button>${state.screen===3?`<input class="reading-progress" name="reading-progress" type="range" min="0" max="${Math.max(1,records[state.child].length-1)}" step="1" value="${state.page}" aria-label="読むページを移動" aria-valuetext="${esc(records[state.child][state.page].date)} ${esc(records[state.child][state.page].title)}" style="--read-progress:${records[state.child].length===1?100:state.page/(records[state.child].length-1)*100}%" ${records[state.child].length===1?'disabled':''}>`:'<span>左右にスワイプ</span>'}<button class="icon-btn" data-action="next" aria-label="次のページ" ${(state.screen===2?Math.floor(state.page/2)===Math.floor((records[state.child].length-1)/2):state.page===records[state.child].length-1)?'disabled':''}>${icon('chevron-right')}</button></div>`;}
function decorations(r){const matched=themes.filter(t=>t.re.test(r.text));const items=[...new Set(matched.flatMap(t=>t.items))].slice(0,3);return items.map((item,i)=>`<span class="margin-sticker position-${i}" aria-hidden="true">${sticker(item)}</span>`).join('');}
function pageHtml(r){return `<article class="paper-page grid-paper"><div class="page-date"><span>${esc(r.date.replaceAll('.',' / '))}</span><span>${children[state.child].age}</span></div><div class="diary-content">${r.source?'<span class="source-label">保育園の連絡帳から</span>':''}<h2>${esc(r.title)}</h2><div class="diary-text">${lineBreaks(r.text)}</div></div>${decorations(r)}${r.photos?.length?`<div class="photo-strip">${r.photos.map(p=>`<div class="photo-print"><img src="${p}" alt="記録に添えた写真"></div>`).join('')}</div>`:''}</article>`;}
function leaf(r,index){return `<button class="leaf" data-read="${index}" aria-label="${esc(r.title)}を大きく読む"><div class="mini-page">${pageHtml(r)}</div></button>`;}
function sheetHtml(){return `<div class="sheet-shade" data-dismiss="true"></div><section class="compose-sheet" role="dialog" aria-modal="true" aria-labelledby="kh-compose-title"><div class="sheet-handle"></div><div class="topbar"><span class="muted">${children[state.child].name} · 2026.09.30</span><button class="icon-btn sheet-close" data-action="close-sheet" aria-label="閉じる">${icon('x')}</button></div><div class="compose"><div class="compose-intro"><h2 id="kh-compose-title">${state.editing?'思い出を、書きなおす。':'今日のこと、ひとこと。'}</h2><p class="muted">写真だけでも。書ける日だけでも。</p></div><div class="entry-area"><textarea aria-label="今日の記録" placeholder="今日、心に残ったことは？">${esc(state.draft)}</textarea></div><div class="attach-row"><button class="secondary" data-action="photo">${icon('image-plus')}写真を追加</button><button class="secondary" data-action="note">${icon('scan-text')}連絡帳から追加</button></div><div class="attachment-list">${attachments.map((a,i)=>`<div class="attachment"><img src="${a.url}" alt="${a.kind==='note'?'連絡帳':'追加した写真'}">${a.kind==='note'?'<small>連絡帳</small>':''}<button data-remove="${i}" aria-label="添付を外す">×</button></div>`).join('')}</div><label class="polish-option"><input type="checkbox" name="polish" ${state.polish?'checked':''}><span>文章を整える<small>書いた内容を変えずに、読みやすく</small></span></label><button class="primary" data-action="generate" ${!state.draft.trim()&&!attachments.length?'disabled':''}>${icon('sparkles')}ページを生成</button><p class="muted" style="text-align:center;margin-top:12px;font-size:11px">確認後に「日記に追加」を押すと記録されます</p></div></section>`;}
function render(){const ch=children[state.child],r=records[state.child][state.page];let html='';
if(state.screen===0)html=`<div class="welcome"><div class="brand"><span class="brand-mark"></span><strong>ことのは</strong></div><div class="eyebrow">LITTLE DAYS, LITTLE STORIES</div><h1 style="margin-top:11px">だれの思い出を<br>ひらこう。</h1><p class="intro">今日の小さなことが、いつかの宝物に。</p><div class="profiles">${children.map((c,i)=>`<button class="profile-card" data-child="${i}">${avatar(i)}<span class="label"><strong>${c.name}</strong><small>${c.age}</small></span>${icon('chevron-right')}</button>`).join('')}</div><div class="welcome-note grid-paper hand"><span class="tape"></span>その子だけの、<br>一冊を育てよう。</div></div>`;
if(state.screen===1)html=`${childHeader(false)}${libraryTitle()}<div class="book-zone"><button class="book-cover" data-action="open-book" aria-label="${ch.name}の日記をひらく">${sticker('sun')}<span class="cover-year">2025 — 2026</span></button></div><button class="continue" data-action="open-book">${icon('bookmark')}前に読んだページから${icon('arrow-right')}</button>${newEntry()}`;
if(state.screen===2){const start=Math.floor(state.page/2)*2,left=records[state.child][start],right=records[state.child][start+1];html=`${childHeader(true)}${libraryTitle()}<div class="book-perspective"><div class="spread" data-swipe="true"><div class="stacked-pages" aria-hidden="true"></div>${leaf(left,start)}${right?leaf(right,start+1):'<div class="leaf blank-leaf grid-paper" aria-label="まだ書いていないページ"></div>'}</div></div>${controls()}<p class="hint">ページをタップして、大きく読む</p>${newEntry()}`;}
if(state.screen===3)html=`<div class="reading"><div class="topbar"><button class="icon-btn" data-screen="2" aria-label="日記をめくる画面へ">${icon('chevron-left')}</button><span class="muted">${ch.name}の記録</span><button class="icon-btn" data-action="menu" aria-label="日記のメニュー" aria-expanded="${state.menu}">${icon('ellipsis')}</button></div>${state.menu?`<div class="menu"><button data-action="edit">${icon('pencil')}このページを編集</button></div>`:''}<div class="reading-stage" data-swipe="true">${pageHtml(r)}</div>${controls()}${newEntry()}</div>`;
if(state.screen===5){const p=preview||makePreview();html=`<div class="topbar"><button class="icon-btn" data-action="edit-preview" aria-label="入力へ戻る">${icon('chevron-left')}</button><span>できあがり</span><span style="width:44px"></span></div><p class="preview-banner">${p.source?'連絡帳の読み取りはデモです。内容を確認してください。':state.polish?'言葉を整えて、思い出を1ページに。':'あなたの言葉を、そのまま1ページに。'}</p>${pageHtml(p)}<div class="preview-controls"><button class="primary" data-action="save">${icon('book-open')}${state.editing?'この内容で更新':'このページを日記に追加'}</button><button class="text-button" data-action="edit-preview">文章・写真を見直す</button></div>`;}
view.innerHTML=`<div class="screen-base" ${state.sheet?'inert aria-hidden="true"':''}>${html}</div>${state.sheet?sheetHtml():''}`;if(globalThis.lucide)lucide.createIcons();if(globalThis.requestAnimationFrame)requestAnimationFrame(sizeMiniatures);}
function sizeMiniatures(){let height=252;for(const mini of root.querySelectorAll('.mini-page')){const w=mini.parentElement.clientWidth,scale=w/360;mini.style.transform=`scale(${scale})`;height=Math.max(height,mini.scrollHeight*scale);}const spread=root.querySelector('.spread');if(spread)spread.style.height=height+'px';}
if(globalThis.ResizeObserver)new ResizeObserver(sizeMiniatures).observe(root);
function reduced(){return globalThis.matchMedia?.('(prefers-reduced-motion: reduce)').matches;}
async function animate(el,frames,options){if(!el?.animate||reduced())return;const motion=el.animate(frames,options);await Promise.race([motion.finished.catch(()=>{}),new Promise(resolve=>setTimeout(resolve,(options.duration||400)+200))]);}
async function openBook(){if(busy)return;busy=true;try{state.screen=2;state.menu=false;render();sizeMiniatures();const spread=root.querySelector('.spread');if(spread){const cover=document.createElement('div');cover.className='opening-cover';cover.innerHTML=sticker('sun');spread.appendChild(cover);await Promise.all([animate(spread,[{transform:'scale(.82) rotateX(8deg)'},{transform:'scale(1) rotateX(0deg)'}],{duration:720,easing:'cubic-bezier(.2,.7,.2,1)',fill:'forwards'}),animate(cover,[{transform:'rotateY(0deg)'},{transform:'rotateY(-180deg)'}],{duration:720,easing:'cubic-bezier(.2,.7,.2,1)',fill:'forwards'})]);cover.remove();}persist();}finally{busy=false;}}
async function closeBook(){if(busy)return;busy=true;const epoch=navigationEpoch;try{const spread=root.querySelector('.spread');if(spread){const cover=document.createElement('div');cover.className='opening-cover';cover.innerHTML=sticker('sun');spread.appendChild(cover);await animate(cover,[{transform:'rotateY(-180deg)'},{transform:'rotateY(0deg)'}],{duration:650,easing:'cubic-bezier(.3,.1,.4,1)',fill:'forwards'});}if(epoch!==navigationEpoch)return;state.screen=1;state.menu=false;render();persist();}finally{busy=false;}}
function pageTarget(dir){if(state.screen===2){const start=Math.floor(state.page/2)*2;return Math.min(records[state.child].length-1,Math.max(0,start+dir*2));}return state.page+dir;}
function createFlip(dir){const host=root.querySelector('.spread');if(!host)return null;const leaves=host.querySelectorAll(':scope > .leaf');const source=leaves[dir>0?1:0];if(!source)return null;const wrapper=document.createElement('div');wrapper.className='flip-layer '+(dir>0?'forward':'backward');wrapper.setAttribute('aria-hidden','true');const front=source.cloneNode(true);front.classList.add('flip-face');front.removeAttribute('data-read');const back=document.createElement('div');back.className='flip-reverse grid-paper';wrapper.append(front,back);host.appendChild(wrapper);return wrapper;}
function createSlide(dir,target){const host=root.querySelector('.reading-stage');if(!host)return null;const outgoing=host.querySelector(':scope > .paper-page'),incoming=document.createElement('div');incoming.className='slide-incoming';incoming.innerHTML=pageHtml(records[state.child][target]);incoming.style.transform=`translateX(${dir*100}%)`;host.appendChild(incoming);return {host,outgoing,incoming,width:host.clientWidth};}
async function turn(dir,layer=null,start=0,targetOverride=null){if(busy)return;const target=targetOverride??pageTarget(dir);if(target<0||target>=records[state.child].length||target===state.page){layer?.remove?.();return;}busy=true;const screen=state.screen,epoch=navigationEpoch;try{if(screen===3){const slide=layer||createSlide(dir,target);if(slide){await Promise.all([animate(slide.outgoing,[{transform:`translateX(${start}px)`},{transform:`translateX(${-dir*slide.width}px)`}],{duration:300,easing:'cubic-bezier(.2,.7,.2,1)',fill:'forwards'}),animate(slide.incoming,[{transform:`translateX(${dir*slide.width+start}px)`},{transform:'translateX(0px)'}],{duration:300,easing:'cubic-bezier(.2,.7,.2,1)',fill:'forwards'})]);}}else{const flip=layer||createFlip(dir);await animate(flip,[{transform:`rotateY(${start}deg)`},{transform:`rotateY(${dir>0?-178:178}deg)`}],{duration:500,easing:'cubic-bezier(.23,.65,.3,1)',fill:'forwards'});}if(state.screen===screen&&!state.sheet&&epoch===navigationEpoch){state.page=target;render();persist();}}finally{busy=false;}}
root.addEventListener('click',e=>{interacted=true;if(suppressClick){e.preventDefault();return;}if(e.target.dataset?.dismiss){closeSheet();return;}const b=e.target.closest?.('button');if(!b||b.disabled)return;if(b.dataset.screen!==undefined){busy=false;gesture=null;nav(+b.dataset.screen);return;}if(busy)return;if(b.dataset.child!==undefined){state.child=+b.dataset.child;state.page=0;state.draft=state.child?'':sample;attachments=[];preview=null;nav(1);return;}if(b.dataset.remove!==undefined){attachments.splice(+b.dataset.remove,1);render();return;}if(b.dataset.read!==undefined){state.page=+b.dataset.read;nav(3);return;}if(b.dataset.page!==undefined){const target=+b.dataset.page;if(target!==state.page)turn(target>state.page?1:-1,null,0,target);return;}
switch(b.dataset.action){case'new':state.editing=false;openSheet();break;case'close-sheet':closeSheet();break;case'open-book':openBook();break;case'close-book':closeBook();break;case'prev':turn(-1);break;case'next':turn(1);break;case'menu':state.menu=!state.menu;render();break;case'edit':{const r=records[state.child][state.page];state.draft=r.text;state.editing=true;attachments=(r.photos||[]).map(url=>({url,kind:'photo'}));openSheet();break;}case'photo':root.querySelector('#kh-photo').click();break;case'note':root.querySelector('#kh-note').click();break;case'edit-preview':openSheet();break;case'generate':preview=makePreview();nav(5);break;case'save':{const p=preview||makePreview();const editing=state.editing;if(editing)records[state.child][state.page]=p;else{records[state.child].push(p);state.page=records[state.child].length-1;}state.editing=false;state.draft='';attachments=[];preview=null;nav(3);msg(editing?'日記を更新しました':'日記に1ページ、思い出が増えました');break;}}
});
root.addEventListener('input',e=>{if(e.target.name==='reading-progress'){e.target.style.setProperty('--read-progress',(+e.target.value/+e.target.max*100)+'%');return;}if(e.target.tagName!=='TEXTAREA')return;state.draft=e.target.value;root.querySelector('[data-action=generate]').disabled=!state.draft.trim()&&!attachments.length;});
root.addEventListener('change',async e=>{if(e.target.name==='reading-progress'){const target=+e.target.value;if(target!==state.page)await turn(target>state.page?1:-1,null,0,target);root.querySelector('.reading-progress')?.focus({preventScroll:true});return;}if(e.target.name==='polish')state.polish=e.target.checked;});
for(const [id,kind]of[['kh-photo','photo'],['kh-note','note']])root.querySelector('#'+id).addEventListener('change',async e=>{for(const file of Array.from(e.target.files||[]).slice(0,4)){if(!file.type.startsWith('image/'))continue;const url=await new Promise(resolve=>{const reader=new FileReader();reader.onload=()=>resolve(reader.result);reader.readAsDataURL(file);});attachments.push({url,kind});}e.target.value='';render();msg(kind==='note'?'連絡帳を追加しました。読み取りはデモです。':'写真を追加しました。切り抜き処理はデモです。');});
root.addEventListener('pointerdown',e=>{const host=e.target.closest?.('[data-swipe]');if(!host||state.sheet||busy||e.button>0)return;gesture={x:e.clientX,y:e.clientY,host,dir:0,layer:null,amount:0};});
root.addEventListener('pointermove',e=>{if(!gesture)return;const g=gesture,dx=e.clientX-g.x,dy=e.clientY-g.y;if(!g.dir&&Math.abs(dy)>Math.abs(dx)&&Math.abs(dy)>12){gesture=null;return;}if(Math.abs(dx)<9&&!g.dir)return;const dir=dx<0?1:-1;if(!g.dir){const target=pageTarget(dir);if(target<0||target>=records[state.child].length||target===state.page)return;g.dir=dir;g.layer=state.screen===3?createSlide(dir,target):createFlip(dir);g.host.setPointerCapture?.(e.pointerId);}if(state.screen===3){g.amount=dx;if(g.layer){g.layer.outgoing.style.transform=`translateX(${dx}px)`;g.layer.incoming.style.transform=`translateX(${g.dir*g.layer.width+dx}px)`;}}else{g.amount=-g.dir*Math.min(155,Math.max(0,(-dx*g.dir)/g.host.clientWidth*230));if(g.layer)g.layer.style.transform=`rotateY(${g.amount}deg)`;}});
async function endGesture(e,cancel=false){if(!gesture)return;const g=gesture;gesture=null;if(!g.layer)return;suppressClick=true;setTimeout(()=>suppressClick=false,150);if(!cancel&&Math.abs(e.clientX-g.x)>35){turn(g.dir,g.layer,g.amount);return;}if(state.screen===3){await Promise.all([animate(g.layer.outgoing,[{transform:`translateX(${g.amount}px)`},{transform:'translateX(0px)'}],{duration:180}),animate(g.layer.incoming,[{transform:`translateX(${g.dir*g.layer.width+g.amount}px)`},{transform:`translateX(${g.dir*g.layer.width}px)`}],{duration:180})]);g.layer.outgoing.style.transform='';g.layer.incoming.remove();}else{await animate(g.layer,[{transform:`rotateY(${g.amount}deg)`},{transform:'rotateY(0deg)'}],{duration:180});g.layer.remove();}}
root.addEventListener('pointerup',e=>endGesture(e));root.addEventListener('pointercancel',e=>endGesture(e,true));
root.addEventListener('keydown',e=>{if(e.target.tagName==='INPUT'&&e.target.type==='range')return;if(state.sheet){if(e.key==='Escape'){e.preventDefault();closeSheet();}if(e.key==='Tab'){const nodes=[...root.querySelectorAll('.compose-sheet button:not(:disabled),.compose-sheet textarea,.compose-sheet input')];const first=nodes[0],last=nodes[nodes.length-1];if(e.shiftKey&&document.activeElement===first){e.preventDefault();last.focus();}else if(!e.shiftKey&&document.activeElement===last){e.preventDefault();first.focus();}}return;}if([2,3].includes(state.screen)&&['ArrowLeft','ArrowRight'].includes(e.key)){e.preventDefault();turn(e.key==='ArrowLeft'?-1:1);}});
render();
})();
</script>
